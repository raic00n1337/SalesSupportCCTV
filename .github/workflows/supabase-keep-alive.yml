name: Supabase Keep-Alive

# Supabase pauses Free Plan projects after 7 days without activity.
# This workflow makes a lightweight, read-only request against the public
# REST API a few times a week so the project is never considered idle.
# No secrets with write access are used - only the public anon key.

on:
  schedule:
    # Runs Monday and Thursday at 06:00 UTC (max gap: 4 days, well under the 7-day pause window)
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/manufacturers?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP status: $http_status"
          cat /tmp/response.json

          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "✅ Supabase project is awake and responded successfully."
          else
            echo "::error::Unexpected response from Supabase (HTTP $http_status)."
            exit 1
          fi
