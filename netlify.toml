# Netlify Configuration für Video-System-Konfigurator
# Next.js 14 App

[build]
  # Build Command
  command = "npm run build"
  
  # Publish Directory - Next.js Static Export
  publish = "out"
  
  # Node Version
  environment = { NODE_VERSION = "20" }

# Redirects für SPA (Single Page Application) Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers für bessere Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache-Control für statische Assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Development Context
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Production Context
[context.production]
  command = "npm run build"

